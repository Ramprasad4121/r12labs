<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #05060a; color: #e7eef8; overflow: hidden; }
  .frame { position: absolute; inset: 48px; border: 1px solid #1a2130; display: flex; flex-direction: column; justify-content: center; padding: 0 72px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; color: #3d7eff; margin: 0 0 22px; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 84px; line-height: 0.95; letter-spacing: -0.04em; margin: 0; }
  p { font-family: "Space Grotesk", sans-serif; font-size: 32px; margin: 28px 0 0; color: #93a0b5; }
</style>
</head>
<body>
  <div class="frame">
    <p class="kicker">R12 Labs</p>
    <h1>Security through proof.</h1>
    <p>Formal verification for EVM and Solana.</p>
  </div>
</body>
</html>
